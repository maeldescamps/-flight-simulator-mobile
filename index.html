<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Simulator Mobile</title>

<style>
body {
  margin: 0;
  background: #87ceeb;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#game {
  height: 100vh;
  position: relative;
}

.sky {
  height: 70%;
  background: linear-gradient(#4aa9ff, #dff6ff);
}

.ground {
  height: 30%;
  background: #555;
  position: relative;
}

.runway {
  width: 80%;
  height: 80px;
  background: #222;
  position: absolute;
  bottom: 30px;
  left: 10%;
  border-radius: 10px;
}

.plane {
  position: absolute;
  font-size: 70px;
  bottom: 110px;
  left: 20%;
  transition: 2s;
}

.panel {
  position: absolute;
  bottom: 10px;
  width: 100%;
  text-align: center;
}

button {
  padding: 15px 25px;
  margin: 5px;
  font-size: 18px;
  border-radius: 15px;
  border: none;
}
</style>

</head>

<body>

<div id="game">

<div class="sky"></div>

<div class="ground">
  <div class="runway"></div>
</div>

<div class="plane" id="plane">
✈️
</div>

<div class="panel">
<button onclick="startEngine()">Démarrer moteur</button>
<button onclick="takeOff()">Décoller</button>
</div>

</div>


<script>

let engine = false;

function startEngine(){
  engine = true;
  alert("Moteurs démarrés ✈️");
}

function takeOff(){

  if(engine){
    let plane = document.getElementById("plane");
    plane.style.bottom = "500px";
    plane.style.left = "60%";
  }
  else{
    alert("Démarre d'abord les moteurs !");
  }

}

</script>

</body>
</html>
